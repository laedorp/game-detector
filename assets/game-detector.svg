  <rect x="45" y="39" width="38" height="51" rx="8" fill="#d9f8ff" fill-opacity=".12" stroke="#dffbff" stroke-width="3"/>
  <circle cx="64" cy="64" r="11" fill="#0e1b31" stroke="#f3fdff" stroke-width="4"/>
  <path d="M64 47v9M64 72v9M47 64h9M72 64h9" stroke="#f3fdff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="3.5" fill="#58e5d0"/>
