<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ProAim</title>
  <desc id="desc">A red illuminated aiming reticle over a black tactical tile.</desc>
  <defs>
    <linearGradient id="background" x1="10" y1="8" x2="118" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="0.55" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rim" x1="20" y1="18" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5757"/>
      <stop offset="1" stop-color="#780909"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="64" cy="64" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a4a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#d41414" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d41414" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="11.5" y="11.5" width="105" height="105" rx="22" fill="none" stroke="#2a0a0a" stroke-width="3"/>
  <circle cx="64" cy="64" r="31" fill="url(#coreGlow)"/>

  <circle cx="64" cy="64" r="25" fill="none" stroke="#120203" stroke-width="8"/>
  <circle cx="64" cy="64" r="24" fill="none" stroke="url(#rim)" stroke-width="4.5"/>
  <circle cx="64" cy="64" r="9.5" fill="#050505" stroke="#ff6868" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="2.75" fill="#ff3b3b"/>

  <path d="M64 21v15M64 92v15M21 64h15M92 64h15" fill="none" stroke="#140303" stroke-width="9" stroke-linecap="round"/>
  <path d="M64 21v15M64 92v15M21 64h15M92 64h15" fill="none" stroke="#ff4d4d" stroke-width="5" stroke-linecap="round"/>

  <path d="M41 41l8 8M87 41l-8 8M41 87l8-8M87 87l-8-8" fill="none" stroke="#260607" stroke-width="8" stroke-linecap="round"/>
  <path d="M41 41l8 8M87 41l-8 8M41 87l8-8M87 87l-8-8" fill="none" stroke="#b30f0f" stroke-width="4" stroke-linecap="round"/>
</svg>
