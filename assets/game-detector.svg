<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Game Detector</title>
  <desc id="desc">A detection frame and focus point over a dark blue tile.</desc>
  <defs>
    <linearGradient id="background" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17233c"/>
      <stop offset="1" stop-color="#09101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="25" y1="25" x2="103" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58e5d0"/>
      <stop offset="1" stop-color="#28a9ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020610" flood-opacity=".55"/>
