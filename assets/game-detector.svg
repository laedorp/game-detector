  <rect x="7" y="7" width="114" height="114" rx="27" fill="url(#background)" filter="url(#shadow)"/>
  <path d="M49 27H32a5 5 0 0 0-5 5v17M79 27h17a5 5 0 0 1 5 5v17M49 101H32a5 5 0 0 1-5-5V79M79 101h17a5 5 0 0 0 5-5V79"
