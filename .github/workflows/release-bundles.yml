name: Build and stage desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Test source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime_variant: cpu
            lock_profile: linux-cpu-py313
            lock_file: requirements-locks/linux-cpu-py313.txt
          - os: windows-2022
            runtime_variant: directml
            lock_profile: windows-directml-py313
            lock_file: requirements-locks/windows-directml-py313.txt
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-runtime-${{ matrix.runtime_variant }}.txt
            requirements-locks/bootstrap-py313.txt
            ${{ matrix.lock_file }}

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install test dependencies
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          python -m venv .release-venv
          mkdir -p .release-metadata
          .release-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --no-compile --force-reinstall \
            --report ".release-metadata/pip-bootstrap-${{ matrix.lock_profile }}.json" \
            -r requirements-locks/bootstrap-py313.txt
          .release-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --no-compile --no-build-isolation --force-reinstall \
            --report ".release-metadata/pip-dependencies-${{ matrix.lock_profile }}.json" \
            -r requirements-locks/bootstrap-py313.txt \
            -r "${{ matrix.lock_file }}"
          .release-venv/bin/python scripts/write_dependency_manifest.py \
            --profile "${{ matrix.lock_profile }}" \
            --pip-report ".release-metadata/pip-bootstrap-${{ matrix.lock_profile }}.json" \
            --pip-report ".release-metadata/pip-dependencies-${{ matrix.lock_profile }}.json" \
            --output ".release-metadata/${{ matrix.lock_profile }}-DEPENDENCY-MANIFEST.json"
          echo "$PWD/.release-venv/bin" >> "$GITHUB_PATH"

      - name: Install test dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .release-venv
          New-Item -ItemType Directory -Path .release-metadata -Force | Out-Null
          $ReleasePython = (Resolve-Path ".release-venv\Scripts\python.exe").Path
          & $ReleasePython -m pip install --disable-pip-version-check --require-hashes --no-compile --force-reinstall `
            --report ".release-metadata\pip-bootstrap-${{ matrix.lock_profile }}.json" `
            -r requirements-locks/bootstrap-py313.txt
          & $ReleasePython -m pip install --disable-pip-version-check --require-hashes --no-compile --no-build-isolation --force-reinstall `
            --report ".release-metadata\pip-dependencies-${{ matrix.lock_profile }}.json" `
            -r requirements-locks/bootstrap-py313.txt `
            -r "${{ matrix.lock_file }}"
          & $ReleasePython scripts/write_dependency_manifest.py `
            --profile "${{ matrix.lock_profile }}" `
            --pip-report ".release-metadata\pip-bootstrap-${{ matrix.lock_profile }}.json" `
            --pip-report ".release-metadata\pip-dependencies-${{ matrix.lock_profile }}.json" `
            --output ".release-metadata\${{ matrix.lock_profile }}-DEPENDENCY-MANIFEST.json"
          (Resolve-Path ".release-venv\Scripts").Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Python sources
        run: python -m compileall -q app.py config.py main.py aiming capture controller_precision detection launcher scripts tests utils

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Validate release assets
        run: python scripts/validate_release_assets.py

      - name: Smoke-test source CLI
        run: python app.py --cli --help

      - name: Report source runtime
        run: python app.py --runtime-info

  build-linux:
    needs: test
    # Build on the oldest supported glibc baseline; tests still exercise 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_variant: cpu
            artifact_name: ProAim-Linux-x64
            zip_name: ProAim-Linux-x64.zip
            lock_profile: linux-cpu-py313
            lock_file: requirements-locks/linux-cpu-py313.txt
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-runtime-${{ matrix.runtime_variant }}.txt
            requirements-locks/bootstrap-py313.txt
            ${{ matrix.lock_file }}

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxkbcommon-x11-0 \
            ocl-icd-libopencl1

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m venv .release-venv
          mkdir -p .release-metadata
          .release-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --no-compile --force-reinstall \
            --report ".release-metadata/pip-bootstrap-${{ matrix.lock_profile }}.json" \
            -r requirements-locks/bootstrap-py313.txt
          .release-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --no-compile --no-build-isolation --force-reinstall \
            --report ".release-metadata/pip-dependencies-${{ matrix.lock_profile }}.json" \
            -r requirements-locks/bootstrap-py313.txt \
            -r "${{ matrix.lock_file }}"
          .release-venv/bin/python scripts/write_dependency_manifest.py \
            --profile "${{ matrix.lock_profile }}" \
            --pip-report ".release-metadata/pip-bootstrap-${{ matrix.lock_profile }}.json" \
            --pip-report ".release-metadata/pip-dependencies-${{ matrix.lock_profile }}.json" \
            --output ".release-metadata/${{ matrix.lock_profile }}-DEPENDENCY-MANIFEST.json"

      - name: Build Linux desktop bundle
        env:
          GAME_DETECTOR_PYTHON: .release-venv/bin/python
          PROAIM_RUNTIME_VARIANT: ${{ matrix.runtime_variant }}
        run: ./scripts/build_linux_app.sh

      - name: Smoke-test frozen Linux CLI
        run: |
          dist/ProAim/ProAim --cli --help
          dist/ProAim/ProAim --runtime-info
          python scripts/smoke_release_default_model.py \
            --bundle dist/ProAim \
            --executable dist/ProAim/ProAim \
            --device CPU \
            --output ".release-metadata/frozen-release-default-${{ matrix.lock_profile }}.json"
          python scripts/validate_linux_bundle.py dist/ProAim --max-glibc 2.35

      - name: Create Linux ZIP
        run: |
          cd dist
          # Preserve PyInstaller's required Linux symlinks in the archive.
          zip -yr "${{ matrix.zip_name }}" ProAim

      - name: Upload Linux ZIP artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.zip_name }}
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_variant: directml
            artifact_name: ProAim-Windows-x64-DirectML
            zip_path: dist/ProAim-Windows-x64-DirectML.zip
            lock_profile: windows-directml-py313
            lock_file: requirements-locks/windows-directml-py313.txt
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-runtime-${{ matrix.runtime_variant }}.txt
            requirements-locks/bootstrap-py313.txt
            ${{ matrix.lock_file }}

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .release-venv
          New-Item -ItemType Directory -Path .release-metadata -Force | Out-Null
          $ReleasePython = (Resolve-Path ".release-venv\Scripts\python.exe").Path
          & $ReleasePython -m pip install --disable-pip-version-check --require-hashes --no-compile --force-reinstall `
            --report ".release-metadata\pip-bootstrap-${{ matrix.lock_profile }}.json" `
            -r requirements-locks/bootstrap-py313.txt
          & $ReleasePython -m pip install --disable-pip-version-check --require-hashes --no-compile --no-build-isolation --force-reinstall `
            --report ".release-metadata\pip-dependencies-${{ matrix.lock_profile }}.json" `
            -r requirements-locks/bootstrap-py313.txt `
            -r "${{ matrix.lock_file }}"
          & $ReleasePython scripts/write_dependency_manifest.py `
            --profile "${{ matrix.lock_profile }}" `
            --pip-report ".release-metadata\pip-bootstrap-${{ matrix.lock_profile }}.json" `
            --pip-report ".release-metadata\pip-dependencies-${{ matrix.lock_profile }}.json" `
            --output ".release-metadata\${{ matrix.lock_profile }}-DEPENDENCY-MANIFEST.json"

      - name: Build Windows desktop bundle
        shell: pwsh
        env:
          GAME_DETECTOR_PYTHON: .release-venv\Scripts\python.exe
        run: ./scripts/build_windows_app.ps1 -RuntimeVariant ${{ matrix.runtime_variant }}

      - name: Smoke-test frozen Windows CLI
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./dist/ProAim/ProAimCLI.exe --cli --help
          ./dist/ProAim/ProAimCLI.exe --runtime-info
          python scripts/smoke_release_default_model.py `
            --bundle dist/ProAim `
            --executable dist/ProAim/ProAimCLI.exe `
            --device CPU `
            --output ".release-metadata/frozen-release-default-${{ matrix.lock_profile }}.json"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_path }}
          if-no-files-found: error
          retention-days: 14

  stage-release-candidate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact tagged source for candidate manifesting
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up candidate-manifest Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"

      - name: Download Linux artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ProAim-Linux-x64
          path: release-assets

      - name: Download Windows DirectML artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ProAim-Windows-x64-DirectML
          path: release-assets

      - name: Create immutable dual-platform candidate manifest
        id: candidate
        run: |
          set -euo pipefail
          python scripts/manage_directml_release.py stage-candidate \
            --root release-assets \
            --repository "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --tag-commit "${{ github.sha }}" \
            --source-build-run-id "${{ github.run_id }}" \
            --result candidate-stage-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("candidate-stage-result.json").read_text(encoding="utf-8"))
          manifest = Path("release-assets/RELEASE-CANDIDATE-MANIFEST.json")
          records = {
              item["path"]: item["sha256"]
              for item in result["manifest"]["files"]
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"candidate_manifest_sha256={result['manifest_sha256']}\n")
              output.write(
                  "directml_zip_sha256="
                  + records["ProAim-Windows-x64-DirectML.zip"]
                  + "\n"
              )
          PY

      - name: Upload immutable release candidate for physical qualification
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ProAim-Release-Candidate
          path: release-assets
          if-no-files-found: error
          retention-days: 30

      - name: Record non-publishing candidate handoff
        env:
          CANDIDATE_MANIFEST_SHA256: ${{ steps.candidate.outputs.candidate_manifest_sha256 }}
          DIRECTML_ZIP_SHA256: ${{ steps.candidate.outputs.directml_zip_sha256 }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          summary = (
              "## Immutable release candidate staged\n\n"
              f"- Tag commit: `{os.environ['GITHUB_SHA']}`\n"
              f"- Candidate manifest SHA-256: `{os.environ['CANDIDATE_MANIFEST_SHA256']}`\n"
              f"- DirectML ZIP SHA-256: `{os.environ['DIRECTML_ZIP_SHA256']}`\n"
              "- Publication status: **not published**\n"
              "- Next gates: sealed physical DirectML evidence from both required GPUs, "
              "then protected transactional publication\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write(summary)
          PY
