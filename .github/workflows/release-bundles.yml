name: Build and publish desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Linux desktop bundle
        env:
          GAME_DETECTOR_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: ./scripts/build_linux_app.sh

      - name: Create Linux ZIP
        run: |
          cd dist
          zip -r ProAim-Linux-x64.zip ProAim

      - name: Upload Linux ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: ProAim-Linux-x64
          path: dist/ProAim-Linux-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_variant: cuda
            artifact_name: ProAim-Windows-x64-NVIDIA-CUDA
            zip_path: dist/ProAim-Windows-x64-NVIDIA-CUDA.zip
          - runtime_variant: directml
            artifact_name: ProAim-Windows-x64-DirectML
            zip_path: dist/ProAim-Windows-x64-DirectML.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          if ('${{ matrix.runtime_variant }}' -eq 'cuda') {
            python -m pip uninstall -y onnxruntime-directml
            python -m pip install "onnxruntime-gpu>=1.22,<2"
          }

      - name: Build Windows desktop bundle
        shell: pwsh
        env:
          GAME_DETECTOR_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: ./scripts/build_windows_app.ps1 -RuntimeVariant ${{ matrix.runtime_variant }}

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_path }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: ProAim-Linux-x64
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: ProAim-Windows-x64-NVIDIA-CUDA
          path: release-assets

      - name: Download Windows DirectML artifact
        uses: actions/download-artifact@v5
        with:
          name: ProAim-Windows-x64-DirectML
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ProAim-Linux-x64.zip
            release-assets/ProAim-Windows-x64-NVIDIA-CUDA.zip
            release-assets/ProAim-Windows-x64-DirectML.zip
          generate_release_notes: true