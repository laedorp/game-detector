name: Build and publish desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime_variant: cpu
          - os: windows-2022
            runtime_variant: directml
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install test dependencies
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Install test dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py config.py main.py aiming capture controller_precision detection launcher scripts tests utils

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Validate release assets
        run: python scripts/validate_release_assets.py

      - name: Smoke-test source CLI
        run: python app.py --cli --help

      - name: Report source runtime
        run: python app.py --runtime-info

  build-linux:
    needs: test
    # Build on the oldest supported glibc baseline; tests still exercise 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_variant: cpu
            artifact_name: ProAim-Linux-x64
            zip_name: ProAim-Linux-x64.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxkbcommon-x11-0 \
            ocl-icd-libopencl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Build Linux desktop bundle
        env:
          GAME_DETECTOR_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          PROAIM_RUNTIME_VARIANT: ${{ matrix.runtime_variant }}
        run: ./scripts/build_linux_app.sh

      - name: Smoke-test frozen Linux CLI
        run: |
          dist/ProAim/ProAim --cli --help
          dist/ProAim/ProAim --runtime-info
          python scripts/validate_linux_bundle.py dist/ProAim --max-glibc 2.35

      - name: Create Linux ZIP
        run: |
          cd dist
          # Preserve PyInstaller's required Linux symlinks in the archive.
          zip -yr "${{ matrix.zip_name }}" ProAim

      - name: Upload Linux ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.zip_name }}
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_variant: directml
            artifact_name: ProAim-Windows-x64-DirectML
            zip_path: dist/ProAim-Windows-x64-DirectML.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Build Windows desktop bundle
        shell: pwsh
        env:
          GAME_DETECTOR_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: ./scripts/build_windows_app.ps1 -RuntimeVariant ${{ matrix.runtime_variant }}

      - name: Smoke-test frozen Windows CLI
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./dist/ProAim/ProAimCLI.exe --cli --help
          ./dist/ProAim/ProAimCLI.exe --runtime-info

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_path }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: ProAim-Linux-x64
          path: release-assets

      - name: Download Windows DirectML artifact
        uses: actions/download-artifact@v5
        with:
          name: ProAim-Windows-x64-DirectML
          path: release-assets

      - name: Create release checksums
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/ProAim-Linux-x64.zip
            release-assets/ProAim-Windows-x64-DirectML.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
