name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_variant: cuda
            artifact_name: ProAim-Windows-x64-NVIDIA-CUDA
            zip_path: dist/ProAim-Windows-x64-NVIDIA-CUDA.zip
          - runtime_variant: directml
            artifact_name: ProAim-Windows-x64-DirectML
            zip_path: dist/ProAim-Windows-x64-DirectML.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-runtime-${{ matrix.runtime_variant }}.txt

      - name: Run source tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m compileall -q app.py config.py main.py aiming capture controller_precision detection launcher scripts tests utils
          python -m unittest discover -s tests
          python scripts/validate_release_assets.py

      - name: Build and package Windows app
        shell: pwsh
        env:
          GAME_DETECTOR_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: ./scripts/build_windows_app.ps1 -RuntimeVariant ${{ matrix.runtime_variant }}

      - name: Smoke-test frozen CLI helper
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./dist/ProAim/ProAimCLI.exe --cli --help
          ./dist/ProAim/ProAimCLI.exe --runtime-info

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_path }}
          if-no-files-found: error
          retention-days: 14
